name: Bug report
description: Report a reproducible problem with omarchy-voice.
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow SECURITY.md. Do not attach API keys, full logs,
        conversation history, screenshots of private accounts, or personal paths.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a minimal example with synthetic inputs where possible.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit or version, Omarchy/Hyprland versions, Python version, and voice engine.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional context
      description: Optional, short, manually sanitized error excerpt. Check it before submitting.
