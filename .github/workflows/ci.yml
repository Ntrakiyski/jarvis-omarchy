name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    name: Publication privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan files and complete commit history
        run: python3 tools/check_public_files.py --history HEAD

  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check Python and shell syntax
        run: |
          python -m compileall -q src tests tools
          bash -n install.sh uninstall.sh share/install-paths.sh .githooks/pre-commit .githooks/pre-push
      - name: Run offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Build distribution
        run: python -m build
      - name: Check CLI entry point
        run: |
          omarchy-voice --help
          omarchy-vision --help
